# Prepared for later. Windows EXEs ship first.
# Mac: avfoundation screen capture. Linux: x11grab / PipeWire.
# Enable by removing the `if: false` on the job.

name: Build Mac and Linux (later)

on:
  workflow_dispatch:

jobs:
  unix:
    if: false
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller customtkinter pillow pypdf numpy sounddevice soundfile
      - run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name Atlas_PDF --collect-all customtkinter windows/pdf/atlas_pdf.py
